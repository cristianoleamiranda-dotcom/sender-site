name: audit
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run build
      - name: HTML validate
        run: npx --yes html-validate@9 dist/index.html || true
      - name: Bundle budget
        run: |
          du -b dist/assets/*.js dist/assets/*.css | sort -n
          JS=$(stat -c%s dist/assets/index-*.js | sort -n | tail -1)
          echo "main bundle: $JS bytes"
          [ "$JS" -lt 700000 ] || { echo "::error::main bundle >700KB"; exit 1; }
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json
